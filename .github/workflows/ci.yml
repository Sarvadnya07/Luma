name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-checks:
    name: Rust Checks & Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 Linux system dependencies (per v2.tauri.app/start/prerequisites).
      # Without these, glib/gio/gobject -sys build scripts fail on pkg-config lookups.
      - name: Install Tauri Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy --workspace -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Dependency Policy
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

      - name: WASM Compilation Check
        run: |
          cargo check -p luma-core --target wasm32-unknown-unknown
          cargo check -p luma-anchor --target wasm32-unknown-unknown

  frontend-checks:
    name: Frontend Typecheck, Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # No explicit version: the action honors root package.json
        # "packageManager": "pnpm@11.20.0" (pinning 9 here caused
        # ERR_PNPM_BAD_PM_VERSION / "Multiple versions of pnpm specified").

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11.20.0 (packageManager pin) requires Node >= 22.13.
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm typecheck

      - name: Frontend Tests
        run: pnpm test

      - name: ESLint
        run: pnpm lint

      - name: Build Packages & Desktop
        run: pnpm build
