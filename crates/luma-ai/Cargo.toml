[package]
name = "luma-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AI integration layer for Luma – abstracts LLM providers for summarisation and embeddings."
homepage = "https://luma.reader"
repository = "https://github.com/luma/luma"
readme = "README.md"
keywords = ["ai", "llm", "summarisation", "embeddings", "luma"]
categories = ["artificial-intelligence", "text-processing"]

[dependencies]
luma-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
# Optional: add a "mock" feature for testing without real providers
mock = []