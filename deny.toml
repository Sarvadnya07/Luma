# Dependency policy for cargo-deny (`cargo deny check advisories licenses bans sources`).
[licenses]
# In cargo-deny config v2, unlicensed and unknown licenses always error by default;
# the removed `unknown`/`unlicensed` keys need no replacement.
allow = ["MIT", "Apache-2.0"]

[advisories]
version = 2
# Keep advisories strict in CI; teams can opt to whitelist specific advisories after review.
# In config v2, vulnerability/unsound advisories always error; `ignore` lists exceptions.
ignore = []
