[workspace]
members = [
    "crates/luma-core",
    "crates/luma-anchor",
    "crates/luma-reader",
    "crates/luma-storage",
    "crates/luma-search",
    "crates/luma-sync",
    "crates/luma-ai",
    "crates/luma-security",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Luma Team"]
license = "MIT"
repository = "https://github.com/luma-reader/luma"
readme = "README.md"

[workspace.dependencies]
# Workspace crates
luma-core = { path = "crates/luma-core" }
luma-anchor = { path = "crates/luma-anchor" }
luma-reader = { path = "crates/luma-reader" }
luma-storage = { path = "crates/luma-storage" }
luma-search = { path = "crates/luma-search" }
luma-sync = { path = "crates/luma-sync" }
luma-ai = { path = "crates/luma-ai" }
luma-security = { path = "crates/luma-security" }

# Serialization & Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde", "js"] }

# Async & Utilities
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "backup", "blob"] }

# Hashing & Security
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
regex = "1.10"

# Tauri 2
tauri = { version = "2.0", default-features = false }
tauri-build = { version = "2.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
